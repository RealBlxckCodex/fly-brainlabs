[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flybrainlab"
version = "0.1.0"
description = "Fly Brain Lab: connectome-driven spiking brain + MuJoCo fly body + LLM experimenter"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<2.4",  # brian2 2.9 uses ndarray.ptp (removed in numpy 2.4)
  "scipy>=1.11",
  "pandas>=2.1",
  "pyarrow>=14",
  "matplotlib>=3.8",
  "mujoco>=3.1",
  "brian2>=2.6",
  "pyyaml>=6",
  "numba>=0.59",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8"]

[project.scripts]
flylab = "flybrainlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flybrainlab = ["body/assets/*.xml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["data: needs downloaded connectome data (skipped otherwise)", "slow: long-running"]
